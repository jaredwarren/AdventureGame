<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>game-test (WASM)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
    }
    /* Ebiten creates and owns the canvas on WASM; do not add one manually. */
    canvas {
      display: block;
      touch-action: none;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      font-size: 13px;
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Open this page at <strong>/</strong> or <strong>/index.html</strong> — tap START on the title screen.</div>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const hint = document.getElementById('hint');
      if (!WebAssembly) {
        hint.textContent = 'WebAssembly is not supported in this browser.';
        return;
      }

      let buildId = '';
      try {
        const res = await fetch('wasm-build-id.txt', { cache: 'no-store' });
        if (res.ok) {
          buildId = (await res.text()).trim();
        }
      } catch (_) {
        // Older builds without a stamp still load game.wasm directly.
      }

      const wasmURL = buildId ? `game.wasm?v=${encodeURIComponent(buildId)}` : 'game.wasm';
      const go = new Go();
      try {
        const result = await WebAssembly.instantiateStreaming(
          fetch(wasmURL, { cache: 'no-store' }),
          go.importObject,
        );
        go.run(result.instance);
        if (buildId) {
          hint.textContent = `Build ${buildId} loaded — tap START on the title screen.`;
        }
      } catch (err) {
        console.error(err);
        hint.textContent =
          'Failed to load game.wasm. Run `make wasm` or `make wasm-rebuild`, then reload.';
      }
    })();
  </script>
</body>
</html>
